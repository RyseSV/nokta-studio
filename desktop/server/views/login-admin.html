<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokta — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1C1C1A;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 100%,rgba(184,82,40,.12) 0%,#1C1C1A 60%)}
.card{background:#2E2E2B;border-radius:18px;padding:48px 40px;width:100%;max-width:380px;border:1px solid rgba(240,236,228,.06)}
.logo{width:160px;margin:0 auto 6px;display:block}
.logo-txt{display:none;font-size:24px;font-weight:700;color:#F0ECE4;text-align:center;margin-bottom:6px}
.sub{font-size:10px;letter-spacing:4px;color:#7A7A72;text-transform:uppercase;margin-bottom:36px;text-align:center}
.field{margin-bottom:16px}
label{display:block;font-size:11px;color:#7A7A72;margin-bottom:6px;letter-spacing:.5px}
input[type=text],input[type=password]{width:100%;background:#1C1C1A;border:1px solid #3a3a37;border-radius:8px;padding:12px 16px;color:#F0ECE4;font-family:'Poppins',sans-serif;font-size:13px;outline:none;transition:border .2s}
input:focus{border-color:#B85228}
.remember{display:flex;align-items:center;gap:10px;margin-bottom:20px;cursor:pointer;user-select:none}
.remember input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#B85228}
.remember span{font-size:12px;color:#7A7A72}
button{width:100%;background:linear-gradient(135deg,#B85228,#d4724a);border:none;border-radius:8px;padding:13px;color:#F0ECE4;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .2s;box-shadow:0 4px 20px rgba(184,82,40,.3)}
button:hover{opacity:.9}
.err{color:#e05a5a;font-size:12px;margin-top:12px;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/img/logo/nokta_lockup_reversed_transparent.png" alt="nokta" onerror="this.style.display='none';document.querySelector('.logo-txt').style.display='block'">
  <div class="logo-txt">nokta<span style="color:#B85228">.</span></div>
  <div class="sub">Panel administrativo</div>
  <form id="f">
    <div class="field">
      <label>USUARIO</label>
      <input type="text" id="usr" placeholder="tu usuario" autocomplete="off">
    </div>
    <div class="field">
      <label>CONTRASEÑA</label>
      <input type="password" id="pw" placeholder="••••••••" autocomplete="off">
    </div>
    <label class="remember">
      <input type="checkbox" id="rem">
      <span>Recordar sesión en este dispositivo</span>
    </label>
    <button type="submit" id="btn">Ingresar</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
const saved = JSON.parse(localStorage.getItem('nk_creds') || 'null');
if (saved) {
  document.getElementById('usr').value = saved.u;
  document.getElementById('pw').value = saved.p;
  document.getElementById('rem').checked = true;
}

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const usr = document.getElementById('usr').value.trim();
  const pw  = document.getElementById('pw').value;
  const rem = document.getElementById('rem').checked;
  btn.textContent = 'Verificando...'; btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: usr, password: pw })
    });
    if (r.ok) {
      if (rem) localStorage.setItem('nk_creds', JSON.stringify({ u: usr, p: pw }));
      else localStorage.removeItem('nk_creds');
      window.location.href = '/admin';
    } else {
      const d = await r.json();
      err.textContent = d.error || 'Error al ingresar';
      btn.textContent = 'Ingresar'; btn.disabled = false;
    }
  } catch {
    err.textContent = 'Error de conexión';
    btn.textContent = 'Ingresar'; btn.disabled = false;
  }
};

// Forzar limpieza de campos — Chromium ignora autocomplete="off"
window.addEventListener('load', () => {
  document.getElementById('usr').value = '';
  document.getElementById('pw').value = '';
});
</script>
</body>
</html>
