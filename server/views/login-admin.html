<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Nokta — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/public/luz/enso-negro-3d.webp">
<style>
/* Entrada "Luz" — igual que la entrada de la app rediseñada: papel, montañas claras,
   enso negro 3D con su anillo de luz y formulario de vidrio blanco. */
:root{
  --papel:#F7F2EA; --tinta:#0E0D0C; --suave:rgba(14,13,12,.6); --tenue:rgba(14,13,12,.42);
  --borde:rgba(14,13,12,.14); --marca:#B75023; --error:#B0412A;
  --font:"Fraunces",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.fondo{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fondo .luz{position:absolute;left:8%;top:-30vh;width:85vh;height:85vh;border-radius:50%;background:radial-gradient(circle,rgba(217,140,95,.34),rgba(217,162,126,.12) 45%,rgba(217,162,126,0) 70%);animation:respira 9s ease-in-out infinite}
.fondo .montes{position:absolute;left:-2%;right:-2%;bottom:0;height:62vh;background:url(/public/luz/montanas-claras.webp) center 80%/cover;opacity:.9;
  -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%);animation:deriva 40s ease-in-out infinite alternate}
@keyframes deriva{to{transform:translateX(-1.5%)}}
@keyframes respira{50%{transform:scale(1.06);opacity:.85}}

.escena{position:relative;min-height:100%;display:grid;grid-template-columns:1fr minmax(360px,420px);grid-template-rows:auto 1fr auto;padding:44px 7vw 40px 56px;gap:24px}
.marca{grid-column:1;grid-row:1}
.marca img{height:38px;width:auto;display:block}
.orbe{grid-column:1;grid-row:1/4;align-self:center;justify-self:center;position:relative;width:min(40vw,62vh);aspect-ratio:1;pointer-events:none}
.orbe .aro{position:absolute;border-radius:50%;border:1px solid rgba(14,13,12,.07)}
.orbe .aro.a1{inset:-6%}.orbe .aro.a2{inset:-18%;border-color:rgba(14,13,12,.045)}.orbe .aro.a3{inset:-32%;border-color:rgba(14,13,12,.03)}
.orbe svg{position:absolute;inset:4%;width:92%;height:92%;overflow:visible}
.orbe .arco{stroke-dasharray:1194;stroke-dashoffset:1194;animation:dibuja 2.6s cubic-bezier(.65,0,.35,1) .5s forwards}
@keyframes dibuja{to{stroke-dashoffset:260}}
.orbe img{position:absolute;left:8.25%;top:21.35%;width:84%;transform-origin:49.7% 39.2%;filter:drop-shadow(0 34px 34px rgba(60,35,20,.28));animation:aparece 1.8s cubic-bezier(.22,.61,.36,1) both,flota 9s ease-in-out 1.8s infinite}
@keyframes aparece{from{opacity:0;transform:scale(.93) rotate(-12deg)}}
@keyframes flota{50%{transform:translateY(-10px) rotate(2.5deg)}}
.lema{grid-column:1;grid-row:3;align-self:end;justify-self:start;font-size:15px;color:var(--tinta);background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);padding:9px 16px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lema em{color:var(--marca)}
.tarjeta{grid-column:2;grid-row:1/4;align-self:center;width:100%;position:relative;z-index:2}

.cabeza{display:none;text-align:center;margin-bottom:22px}
.cabeza img{height:30px;margin:0 auto}

.vidrio{position:relative;padding:36px 34px 30px;border-radius:24px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 34px 70px -34px rgba(80,50,30,.4);display:grid;gap:16px}
.titulo small{display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--marca)}
.titulo small i{width:6px;height:6px;border-radius:50%;background:var(--marca);box-shadow:0 0 10px 2px rgba(183,80,35,.45)}
.titulo h2{font-weight:300;font-size:40px;line-height:1.02;letter-spacing:-.025em;margin-top:14px}
.titulo h2 em{color:var(--marca)}
.titulo p{font-size:14px;color:var(--suave);margin-top:8px}

.campo{display:grid;gap:4px}
.campo label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--tenue)}
.caja{height:44px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--borde);transition:border-color .2s}
.caja:focus-within{border-bottom-color:var(--marca)}
.caja svg{width:15px;height:15px;flex:none;stroke:var(--tenue);fill:none;stroke-width:1.5;transition:stroke .2s}
.caja:focus-within>svg{stroke:var(--marca)}
.caja input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--tinta);font:400 17px var(--font)}
.caja input::placeholder{color:rgba(14,13,12,.32)}
.ojo{background:none;border:0;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.ojo:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.ojo svg{stroke:var(--tenue)}

.recordar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--suave);cursor:pointer;user-select:none;margin-top:4px}
.recordar input{position:absolute;opacity:0;pointer-events:none}
.switch{width:38px;height:22px;border-radius:99px;background:rgba(14,13,12,.14);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.recordar input:checked+.switch{background:var(--marca)}
.recordar input:checked+.switch::after{transform:translateX(16px)}
.recordar input:focus-visible+.switch{outline:2px solid var(--marca);outline-offset:2px}

.error{display:none;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(176,65,42,.08);color:var(--error);font-size:13px}
.error.si{display:flex}
.error.tiembla{animation:tiembla .4s}
@keyframes tiembla{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.boton{height:52px;border:0;border-radius:999px;background:var(--tinta);color:#F8F4EE;font:400 16px var(--font);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:8px;cursor:pointer;margin-top:6px;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.boton::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--marca);box-shadow:0 0 10px 2px rgba(183,80,35,.5)}
.boton:hover{transform:translateY(-1px);box-shadow:0 14px 28px -14px rgba(14,13,12,.5)}
.boton:focus-visible{outline:2px solid var(--marca);outline-offset:3px}
.boton:disabled{opacity:.8;cursor:default;transform:none}
.boton svg{display:none}
.rueda{width:14px;height:14px;border-radius:50%;border:2px solid rgba(248,244,238,.3);border-top-color:#F8F4EE;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.pie{display:none;text-align:center;font-size:12px;color:var(--tenue);margin-top:22px}

.entra{animation:entra 1s cubic-bezier(.2,.8,.2,1) both}
.entra.d2{animation-delay:.12s}
@keyframes entra{from{opacity:0;transform:translateY(16px)}}

/* Celular: el enso arriba y el formulario abajo */
@media (max-width:859px){
  .escena{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 20px 28px;gap:8px}
  .marca,.lema{display:none}
  .orbe{width:min(58vw,240px);margin-bottom:10px}
  .tarjeta{max-width:400px}
  .cabeza,.pie{display:block}
  .titulo h2{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  .entra,.error.tiembla,.orbe img,.orbe .arco,.fondo .luz,.fondo .montes{animation:none}
  .orbe .arco{stroke-dashoffset:260}
}
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"><div class="luz"></div><div class="montes"></div></div>

<main class="escena">
  <div class="marca entra"><img src="/public/luz/logo-color.webp" alt="Nokta"></div>

  <div class="orbe" aria-hidden="true">
    <span class="aro a1"></span><span class="aro a2"></span><span class="aro a3"></span>
    <svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="190" fill="none" stroke="rgba(14,13,12,.08)" stroke-width="1.5"/><circle class="arco" cx="200" cy="200" r="190" fill="none" stroke="#B75023" stroke-width="2" stroke-linecap="round" transform="rotate(-90 200 200)"/></svg>
    <img src="/public/luz/enso-negro-3d.webp" alt="">
  </div>

  <p class="lema entra">Cada momento tiene su <em>punto exacto.</em></p>

  <div class="tarjeta">
    <div class="cabeza entra"><img src="/public/luz/logo-color.webp" alt="Nokta"></div>

    <form id="f" class="vidrio entra d2" novalidate>
      <div class="titulo">
        <small><i></i>Nokta Studio · Panel</small>
        <h2>Bienvenido<br>de <em>vuelta.</em></h2>
        <p>Entra para ver cómo va el estudio hoy.</p>
      </div>

      <div class="campo">
        <label for="usr">Usuario</label>
        <div class="caja">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input type="text" id="usr" name="username" placeholder="Tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
        </div>
      </div>

      <div class="campo">
        <label for="pw">Contraseña</label>
        <div class="caja">
          <svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="pw" name="password" placeholder="Tu contraseña" autocomplete="current-password">
          <button type="button" class="ojo" id="ojo" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke-width="1.5"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <label class="recordar" for="rem">
        <span>Recordar sesión en este dispositivo</span>
        <input type="checkbox" id="rem">
        <span class="switch"></span>
      </label>

      <div class="error" id="err" role="alert">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg>
        <span id="errtxt"></span>
      </div>

      <button type="submit" class="boton" id="btn">
        <span id="btntxt">Ingresar</span>
        <svg viewBox="0 0 24 24" id="flecha"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="pie">Nokta Studio · © <span id="anio"></span></p>
  </div>
</main>

<script>
// Remove any previously stored plain-text credentials (security cleanup)
localStorage.removeItem('nk_creds');

document.getElementById('anio').textContent = new Date().getFullYear();

const pw = document.getElementById('pw');
document.getElementById('ojo').onclick = e => {
  const ver = pw.type === 'password';
  pw.type = ver ? 'text' : 'password';
  e.currentTarget.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  pw.focus();
};

const btn = document.getElementById('btn'), btntxt = document.getElementById('btntxt'), flecha = document.getElementById('flecha');
const err = document.getElementById('err'), errtxt = document.getElementById('errtxt');

function cargando(si) {
  btn.disabled = si;
  btntxt.textContent = si ? 'Ingresando…' : 'Ingresar';
  flecha.style.display = si ? 'none' : '';
  const r = btn.querySelector('.rueda');
  if (si && !r) { const s = document.createElement('span'); s.className = 'rueda'; btn.prepend(s); }
  if (!si && r) r.remove();
}
function mostrarError(msg) {
  errtxt.textContent = msg;
  err.classList.add('si');
  err.classList.remove('tiembla'); void err.offsetWidth; err.classList.add('tiembla');
  pw.focus();
}
// Llegó aquí porque el servidor cerró la sesión por inactividad.
if (new URLSearchParams(location.search).get('salida') === 'inactividad') {
  errtxt.textContent = 'Cerramos tu sesión por inactividad. Vuelve a entrar.';
  err.classList.add('si');
  history.replaceState(null, '', '/admin');
}

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const usr = document.getElementById('usr').value.trim();
  const clave = pw.value;
  const rem = document.getElementById('rem').checked;
  err.classList.remove('si');
  cargando(true);
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: usr, password: clave, remember: rem })
    });
    if (r.ok) {
      window.location.href = '/admin';
    } else {
      const d = await r.json().catch(() => ({}));
      mostrarError(d.error || 'Error al ingresar');
      cargando(false);
    }
  } catch {
    mostrarError('Error de conexión');
    cargando(false);
  }
};

</script>
</body>
</html>
